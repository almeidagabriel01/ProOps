name: Deploy Firebase Functions — Staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [develop]
    paths:
      - 'apps/functions/**'
      - 'firebase/firestore.rules'
      - 'firebase/firestore.indexes.json'
      - 'firebase.json'

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/functions/package-lock.json

      - name: Install functions dependencies
        run: cd apps/functions &&npm ci

      - name: Build functions
        run: cd apps/functions &&npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      # Sem este arquivo, funcoes NOVAS nascem sem env vars (o update de uma
      # funcao existente preserva as vars, o create nao).
      - name: Write functions env file
        env:
          FUNCTIONS_ENV: ${{ secrets.FUNCTIONS_ENV_STAGING }}
        run: |
          printf '%s' "$FUNCTIONS_ENV" > apps/functions/.env.erp-softcode
          grep -q '^RESEND_API_KEY=' apps/functions/.env.erp-softcode || {
            echo "::error::secret FUNCTIONS_ENV_STAGING ausente ou incompleto — veja .claude/rules/ci-cd.md"
            exit 1
          }

      - name: Deploy to staging (dev project)
        run: firebase deploy --project dev --only functions,firestore:rules,firestore:indexes

      - name: Revoke credentials
        if: always()
        run: rm -f /tmp/sa.json apps/functions/.env.erp-softcode
