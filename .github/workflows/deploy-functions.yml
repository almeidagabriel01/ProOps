name: Deploy Firebase Functions — Staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'apps/functions/**'
      - 'firebase/firestore.rules'
      - 'firebase/firestore.indexes.json'
      - 'firebase.json'

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/functions/package-lock.json

      - name: Install functions dependencies
        run: cd apps/functions &&npm ci

      - name: Build functions
        run: cd apps/functions &&npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      # Sem este arquivo, funcoes NOVAS nascem sem env vars (o update de uma
      # funcao existente preserva as vars, o create nao).
      - name: Write functions env file
        env:
          FUNCTIONS_ENV: ${{ secrets.FUNCTIONS_ENV_STAGING }}
        run: |
          ENV_FILE=apps/functions/.env.erp-softcode
          SECRET_NAME=FUNCTIONS_ENV_STAGING
          printf '%s' "$FUNCTIONS_ENV" > "$ENV_FILE"
          # Uma variavel so nao prova que o secret esta atualizado: RESEND_API_KEY
          # existe desde sempre, entao o teste passava com um secret congelado
          # meses atras. A lista cobre o que cada integracao precisa para nao
          # falhar em silencio — sem token fiscal a emissao morre com
          # FOCUS_NFE_TOKEN_NAO_CONFIGURADO, sem chave KMS a senha do
          # certificado nao decifra, e nenhum dos dois aparece no deploy.
          missing=""
          for key in             RESEND_API_KEY             STRIPE_SECRET_KEY             FOCUS_NFE_MASTER_TOKEN             FISCAL_SECRET_KMS_KEY             CALENDAR_TOKEN_KMS_KEY
          do
            grep -qE "^${key}=." "$ENV_FILE" || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::secret $SECRET_NAME desatualizado — faltam:$missing. Veja .claude/rules/ci-cd.md"
            exit 1
          fi

      - name: Deploy to staging (dev project)
        run: firebase deploy --project dev --only functions,firestore:rules,firestore:indexes

      - name: Revoke credentials
        if: always()
        run: rm -f /tmp/sa.json apps/functions/.env.erp-softcode
