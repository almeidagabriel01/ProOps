name: Reusable — Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          functions: 'true'

      - name: Lint frontend
        run: npm run lint

      - name: Lint functions
        run: cd apps/functions && npm run lint
